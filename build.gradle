plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        url "https://maven.terraformersmc.com/releases/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modCompileOnly "com.terraformersmc:modmenu:11.0.3"
    modRuntimeOnly "com.terraformersmc:modmenu:11.0.3"
}

loom {
    runs {
        client {
            programArgs "--quickPlayMultiplayer", "127.0.0.1:25565"
            programArgs "--username", "Player239"
            if (project.hasProperty("alwinsize")) {
                String[] wh = project.property("alwinsize").toString().split("x")
                programArgs "--width", wh[0]
                programArgs "--height", wh[1]
            }
            if (project.hasProperty("alvmargs")) {
                vmArgs project.property("alvmargs").toString().split(" ").toList()
            }
        }
        server {
            if (project.hasProperty("alvmargs")) {
                vmArgs project.property("alvmargs").toString().split(" ").toList()
            }
        }
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
